services:
  postgres:
    image: postgres:16-alpine
    container_name: fittrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fittrack
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack_local_demo
    ports:
      - "5432:5432"
    volumes:
      - fittrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fittrack -d fittrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fittrack_postgres_data:
